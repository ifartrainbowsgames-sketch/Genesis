name: CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r apps/server/requirements.txt
      - run: python -m compileall apps/server/app
      - name: Smoke-test MCP imports
        run: |
          python -c "from apps.server.app.tools.mcp_tools import servers; assert servers() == {'servers': []}"
      - name: Smoke-test Researcher and voice imports
        run: |
          python -c "from apps.server.app.services.researcher import research; from apps.server.app.services.voice import transcribe_wav; assert research and transcribe_wav"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: apps/web
        run: npm install
      - working-directory: apps/web
        run: npm run build

  desktop-sidecar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install -r apps/server/requirements-build.txt
      - name: Build packaged FastAPI sidecar
        shell: pwsh
        run: ./scripts/build-sidecar.ps1 -SkipInstall
      - name: Compile-check Tauri desktop shell
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
