name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://genesis:genesis@127.0.0.1:5432/genesis
      GENESIS_RUN_DB_INTEGRATION: "1"
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: genesis
          POSTGRES_PASSWORD: genesis
          POSTGRES_DB: genesis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U genesis -d genesis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r apps/server/requirements-dev.txt
      - run: python -m compileall apps/server/app
      - name: Run server tests
        run: python -m pytest -q apps/server/tests
      - name: Smoke-test embedded SQLite backend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./build/genesis-ci.db
        run: |
          mkdir -p build
          python - <<'PY'
          import asyncio
          from sqlalchemy import select
          from apps.server.app.db import SessionLocal, database_backend, init_db
          from apps.server.app.models import MemoryRecord

          async def main():
              assert database_backend() == "sqlite"
              await init_db()
              async with SessionLocal() as session:
                  session.add(MemoryRecord(conversation_id="ci", role="user", content="embedded database", embedding=[0.0] * 768))
                  await session.commit()
                  rows = (await session.execute(select(MemoryRecord))).scalars().all()
                  assert len(rows) == 1
                  assert len(rows[0].embedding) == 768

          asyncio.run(main())
          PY
      - name: Smoke-test MCP imports
        run: |
          python -c "from apps.server.app.tools.mcp_tools import servers; assert servers() == {'servers': []}"
      - name: Smoke-test runtime imports
        run: |
          python -c "from apps.server.app.services.scheduler import scheduler_state; from apps.server.app.services.workers import list_workers; from apps.server.app.services.evolution import score_output; assert scheduler_state and list_workers and score_output"
      - name: Smoke-test Researcher and voice imports
        run: |
          python -c "from apps.server.app.services.researcher import research; from apps.server.app.services.voice import transcribe_wav; assert research and transcribe_wav"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - working-directory: apps/web
        run: npm install
      - working-directory: apps/web
        run: npm run build

  desktop-sidecar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install -r apps/server/requirements-build.txt
      - name: Build packaged FastAPI sidecar
        shell: pwsh
        run: ./scripts/build-sidecar.ps1 -SkipInstall
      - name: Launch packaged sidecar with embedded database
        shell: pwsh
        run: |
          $databasePath = Join-Path $env:RUNNER_TEMP "genesis-desktop-ci.db"
          $databaseUrlPath = $databasePath.Replace("\", "/")
          $stdoutPath = Join-Path $env:RUNNER_TEMP "genesis-sidecar-stdout.log"
          $stderrPath = Join-Path $env:RUNNER_TEMP "genesis-sidecar-stderr.log"
          Remove-Item $stdoutPath, $stderrPath -ErrorAction SilentlyContinue

          $env:DATABASE_URL = "sqlite+aiosqlite:///$databaseUrlPath"
          $env:SCHEDULER_ENABLED = "false"
          $env:SERVER_HOST = "127.0.0.1"
          $env:WEB_ORIGIN = "http://tauri.localhost"
          $env:GENESIS_DEFAULT_PROVIDER = "openai"
          $env:OPENAI_API_KEY = "ci-placeholder-key-not-used-for-network"
          $env:OLLAMA_BASE_URL = "http://127.0.0.1:1"
          $env:SEARXNG_URL = ""

          $process = Start-Process `
            -FilePath "./build/sidecar/genesis-server.exe" `
            -RedirectStandardOutput $stdoutPath `
            -RedirectStandardError $stderrPath `
            -PassThru

          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) { break }
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8000/health" -TimeoutSec 1
                if ($health.status -eq "ok") {
                  $ready = $true
                  break
                }
              } catch {}
            }

            if (-not $ready) {
              $process.Refresh()
              Write-Host "--- Genesis sidecar stdout ---"
              if (Test-Path $stdoutPath) { Get-Content $stdoutPath }
              Write-Host "--- Genesis sidecar stderr ---"
              if (Test-Path $stderrPath) { Get-Content $stderrPath }
              $exitDetail = if ($process.HasExited) { "exit code $($process.ExitCode)" } else { "still running" }
              throw "Packaged Genesis sidecar did not become healthy ($exitDetail)"
            }

            $system = Invoke-RestMethod -Uri "http://127.0.0.1:8000/v1/system/health" -TimeoutSec 10
            if ($system.status -ne "ready") { throw "Packaged Genesis system health was $($system.status)" }
            if ($system.components.database.status -ne "ready") { throw "Embedded database was not ready" }
            if ($system.components.database.backend -ne "sqlite") { throw "Desktop sidecar did not use SQLite" }
            if ($system.components.ai_provider.provider -ne "openai") { throw "Selected provider health was not respected" }
            if (-not (Test-Path $databasePath)) { throw "Embedded SQLite database file was not created" }

            Invoke-RestMethod -Uri "http://127.0.0.1:8000/v1/tasks" -TimeoutSec 5 | Out-Null

            $preflight = Invoke-WebRequest `
              -Uri "http://127.0.0.1:8000/health" `
              -Method Options `
              -Headers @{
                Origin = "http://tauri.localhost"
                "Access-Control-Request-Method" = "GET"
              } `
              -TimeoutSec 5
            if ($preflight.Headers["Access-Control-Allow-Origin"] -ne "http://tauri.localhost") {
              throw "Packaged sidecar did not allow the Tauri production origin"
            }
            Write-Host "Packaged desktop API, embedded SQLite, provider health, and CORS checks passed."
          } finally {
            if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm install
      - name: Install web dependencies for Tauri beforeBuildCommand
        working-directory: apps/web
        run: npm install
      - name: Compile-check Tauri desktop shell
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Build Genesis NSIS installer
        working-directory: apps/desktop
        run: npm run tauri build -- --bundles nsis
      - name: Smoke-test silent NSIS install path
        shell: pwsh
        run: |
          $installer = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Silent installer exited with code $($process.ExitCode)" }
          Write-Host "NSIS installer built and silent install path completed successfully."
