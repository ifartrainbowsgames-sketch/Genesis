name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://genesis:genesis@127.0.0.1:5432/genesis
      GENESIS_RUN_DB_INTEGRATION: "1"
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: genesis
          POSTGRES_PASSWORD: genesis
          POSTGRES_DB: genesis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U genesis -d genesis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r apps/server/requirements-dev.txt
      - run: python -m compileall apps/server/app
      - name: Run server tests
        run: python -m pytest -q apps/server/tests
      - name: Smoke-test MCP imports
        run: |
          python -c "from apps.server.app.tools.mcp_tools import servers; assert servers() == {'servers': []}"
      - name: Smoke-test runtime imports
        run: |
          python -c "from apps.server.app.services.scheduler import scheduler_state; from apps.server.app.services.workers import list_workers; from apps.server.app.services.evolution import score_output; assert scheduler_state and list_workers and score_output"
      - name: Smoke-test Researcher and voice imports
        run: |
          python -c "from apps.server.app.services.researcher import research; from apps.server.app.services.voice import transcribe_wav; assert research and transcribe_wav"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - working-directory: apps/web
        run: npm install
      - working-directory: apps/web
        run: npm run build

  desktop-sidecar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install -r apps/server/requirements-build.txt
      - name: Build packaged FastAPI sidecar
        shell: pwsh
        run: ./scripts/build-sidecar.ps1 -SkipInstall
      - name: Launch packaged sidecar and smoke-test desktop API
        shell: pwsh
        run: |
          $env:DATABASE_URL = "postgresql+asyncpg://genesis:genesis@127.0.0.1:1/genesis"
          $env:SCHEDULER_ENABLED = "false"
          $env:SERVER_HOST = "127.0.0.1"
          $env:WEB_ORIGIN = "http://tauri.localhost"
          $process = Start-Process -FilePath "./build/sidecar/genesis-server.exe" -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 45; $i++) {
              Start-Sleep -Seconds 1
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8000/health" -TimeoutSec 2
                if ($health.status -eq "ok") {
                  $ready = $true
                  break
                }
              } catch {}
            }
            if (-not $ready) { throw "Packaged Genesis sidecar did not become healthy" }

            $preflight = Invoke-WebRequest `
              -Uri "http://127.0.0.1:8000/health" `
              -Method Options `
              -Headers @{
                Origin = "http://tauri.localhost"
                "Access-Control-Request-Method" = "GET"
              } `
              -TimeoutSec 5
            if ($preflight.Headers["Access-Control-Allow-Origin"] -ne "http://tauri.localhost") {
              throw "Packaged sidecar did not allow the Tauri production origin"
            }
            Write-Host "Packaged desktop API health and CORS checks passed."
          } finally {
            if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm install
      - name: Compile-check Tauri desktop shell
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Build Genesis NSIS installer
        working-directory: apps/desktop
        run: npm run tauri build -- --bundles nsis
      - name: Smoke-test silent NSIS install path
        shell: pwsh
        run: |
          $installer = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Silent installer exited with code $($process.ExitCode)" }
          Write-Host "NSIS installer built and silent install path completed successfully."
