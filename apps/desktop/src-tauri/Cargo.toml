[package]
name = "genesis-desktop"
version = "0.1.0"
description = "Genesis local-first AI workspace"
authors = ["Genesis"]
edition = "2021"

[lib]
name = "genesis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
